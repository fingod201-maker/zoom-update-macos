name: Compile AppleScript

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain

      - name: Compile AppleScript, bundle icon and build pkg
        run: bash build/build-macos.sh
        env:
          VERSION: ${{ steps.version.outputs.value }}

      - name: Notarize
        if: env.HAS_CERT == 'true' && env.APPLE_ID != ''
        run: |
          set -euo pipefail
          for file in build/out/*.zip build/out/*.pkg; do
            xcrun notarytool submit "$file" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$file" || true
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZoomUpdate-${{ github.sha }}
          path: |
            build/out/*.zip
            build/out/*.pkg
            build/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/out/*.zip
            build/out/*.pkg
            build/out/SHA256SUMS
          generate_release_notes: true
